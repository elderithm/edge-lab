[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-edge-lab"
version = "0.1.0"
description = "Read-only Polymarket research and paper-trading lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ELDERITHM K.K." }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
edge-lab = "edge_lab.cli:main"

[tool.setuptools.packages.find]
include = ["edge_lab*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # typer relies on function-call defaults (Option/Argument)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that hit the real Polymarket API (opt-in, not run in CI)"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.11"
packages = ["edge_lab"]
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
